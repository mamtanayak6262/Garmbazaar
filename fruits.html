
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruits</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0fff0;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: green;
        }

        .fruits {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .fruit {
            background-color: white;
            width: 180px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 8px #cccccc;
        }

        .fruit img {
            width: 150px;
            height: 130px;
            object-fit: cover;
            border-radius: 10px;
        }

        .fruit h2 {
            color: #ff6347;
        }
    </style>
</head>

<body>

    <h1>🍎 Welcome to Fruits World 🍌</h1>
    <p>Here are some delicious and healthy fruits!</p>

    <div class="fruits">

        <div class="fruit">
            <img src="https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=300"
                 alt="Apple">
            <h2>Apple</h2>
            <p>Red and sweet fruit.</p>
        </div>

        <div class="fruit">
            <img src="https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=300"
                 alt="Banana">
            <h2>Banana</h2>
            <p>Yellow and tasty fruit.</p>
        </div>

        <div class="fruit">
            <img src="https://images.unsplash.com/photo-1553279768-865429fa0078?w=300"
                 alt="Mango">
            <h2>Mango</h2>
            <p>The king of fruits.</p>
        </div>

        <div class="fruit">
            <img src="https://images.unsplash.com/photo-1519996529931-28324d9a630e?w=300"
                 alt="Orange">
            <h2>Orange</h2>
            <p>Juicy and rich in vitamin C.</p>
        </div>

    </div>

</body>
</html>
